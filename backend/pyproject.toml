[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "**/migrations/*",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "DJ",  # flake8-django
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "RUF012", # Mutable default value for class attribute (standard in Django/DRF)
]
